services:

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:

      # =========================
      # SERVER
      # =========================

      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # =========================
      # CORS
      # =========================

      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,DELETE"
      CORS_CREDENTIALS: "true"

      # =========================
      # AUTHENTICATION
      # =========================

      AUTHENTICATION_API_KEY: 'YOUR_API_KEY'

      # =========================
      # LOG
      # =========================

      LOG_LEVEL: "ERROR,WARN,INFO,LOG,DEBUG,WEBHOOKS"

      # =========================
      # DATABASE
      # =========================

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"

      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution_password@postgres:5432/evolution"

      DATABASE_CONNECTION_CLIENT_NAME: "evolution_api"

      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # =========================
      # REDIS
      # =========================

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/1"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"

      CACHE_LOCAL_ENABLED: "false"

      # =========================
      # WEBHOOK
      # =========================

      WEBHOOK_GLOBAL_ENABLED: "false"

      # =========================
      # WEBSOCKET
      # =========================

      WEBSOCKET_ENABLED: "false"

      LANGUAGE: "en"

    volumes:
      - evolution_instances:/evolution/instances

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_started


  # =================================
  # POSTGRESQL
  # =================================

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U evolution -d evolution"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # =================================
  # REDIS
  # =================================

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data


# =================================
# VOLUMES
# =================================

volumes:

  evolution_instances:

  postgres_data:

  redis_data:
